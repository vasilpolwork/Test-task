name: AI Self-Improvement Agent

on:
  # Run the workflow every 2 hours
  schedule:
    - cron: '0 */2 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  improve:
    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Grant write permissions to allow the bot to push changes
    permissions:
      contents: write

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Initialize Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install required Python packages from requirements.txt
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Step 4: Run AI Agent
      - name: Run AI Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: python agent/agent.py

      # Step 5: Commit and Push with dynamic message
      - name: Commit and Push
        run: |
          git config --global user.name "AI-Agent-Bot"
          git config --global user.email "ai-bot@users.noreply.github.com"
          
          git add .
          
          if [ -f .commit_msg ]; then
            # Read the AI-generated message and add [skip ci]
            COMMIT_TEXT=$(cat .commit_msg)
            git commit -m "$COMMIT_TEXT [skip ci]"
            git push
            # Clean up the message file
            rm .commit_msg
          else
            echo "No changes to commit."
          fi