name: AI Self-Improvement Cycle & Ephemeral Testing

on:
  #schedule:
  #  - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # STAGE 1: AI Agent refactors code and pushes to a temporary branch
  improve:
    name: AI Code Enhancement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run AI Improvement Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: python agent/agent.py

      - name: Push to Temporary Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .commit_msg ]; then
            git config --global user.name "AI-Agent-Bot"
            git config --global user.email "ai-bot@users.noreply.github.com"
          
            # Authenticate Git with the short-lived GitHub Token
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          
            # Create or update the buffer branch for testing
            git checkout -b ai-improved-code
            git add .
            git commit -m "$(cat .commit_msg) [skip ci]"
            git push origin ai-improved-code --force
          else
            echo "No changes detected. Skipping push."
          fi

  # STAGE 2: Provision the Hetzner VPS (Runner)
  provision:
    name: Infrastructure Provisioning
    needs: improve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@v4
      - name: Install Hetzner Cloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/
      - name: Deploy Ephemeral VPS
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash infra/deploy.sh

  # STAGE 3: Validate the AI-improved code on the ephemeral Runner
  test:
    name: Validation on Self-hosted Runner
    needs: [improve, provision]
    runs-on: self-hosted
    steps:
      # Bypass Artifacts service by checking out the temporary branch directly
      - name: Checkout Improved Code
        uses: actions/checkout@v4
        with:
          ref: ai-improved-code

      - name: Execute Pytest Suite
        run: |
          # Use --break-system-packages to bypass PEP 668 on ephemeral Ubuntu 24.04
          pip install pytest --break-system-packages
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --break-system-packages
          fi
          pytest tests/ || exit 1

  # STAGE 4: If tests pass, merge the verified branch into main
  deploy:
    name: Merge to Main
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge AI Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "AI-Agent-Bot"
          git config --global user.email "ai-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          
          # Perform a non-fast-forward merge to keep the verification record
          git merge origin/ai-improved-code --no-ff -m "Verified: AI improvement cycle completed"
          git push origin main
          
          # Clean up the temporary branch after successful deployment
          git push origin --delete ai-improved-code

  # STAGE 5: Resource Cleanup
  cleanup:
    name: Infrastructure Cleanup
    needs: [provision, test, deploy]
    # Execute cleanup regardless of success or failure of preceding jobs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Install Hetzner Cloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/
      - name: Destroy Ephemeral VPS
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          # Locate and delete the server using its scope label
          SERVER_ID=$(hcloud server list --selector scope=ephemeral-test -o noheader -o "columns=id")
          if [ -n "$SERVER_ID" ]; then
            echo "Destroying ephemeral server: $SERVER_ID"
            hcloud server delete $SERVER_ID
          else
            echo "No active ephemeral servers found for cleanup."
          fi