name: AI Self-Improvement Cycle & Ephemeral Testing

on:
  # Automated cycle every 2 hours
  #schedule:
  #  - cron: '0 */2 * * *'
  # Manual trigger for debugging/testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # STAGE 1: AI Agent refactors the code and generates documentation
  improve:
    name: AI Code Enhancement
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.changed }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Note: GitHub-hosted runners are usually fine, but we keep it consistent
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run AI Improvement Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: python agent/agent.py

      - name: Verify if changes were made
        id: check_changes
        run: |
          if [ -f .commit_msg ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Pack everything including hidden files for the next runners
      - name: Upload Artifact (Improved Code)
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: improved-code
          path: .
          include-hidden-files: true

  # STAGE 2: Spin up the ephemeral Hetzner VPS
  provision:
    name: Infrastructure Provisioning
    needs: improve
    if: needs.improve.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@v4

      - name: Install Hetzner Cloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/

      - name: Deploy Ephemeral VPS via deploy.sh
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash infra/deploy.sh

  # STAGE 3: Run validation tests on the Self-hosted Runner (Hetzner)
  test:
    name: Validation on Self-hosted Runner
    needs: [improve, provision]
    # Target the ephemeral CX23 VPS created in Stage 2
    runs-on: self-hosted
    steps:
      - name: Download Improved Code Artifact
        uses: actions/download-artifact@v4
        with:
          name: improved-code

      - name: Execute Pytest Suite
        run: |
          # Bypassing PEP 668 via --break-system-packages for ephemeral CI environment
          pip install pytest --break-system-packages
          
          # Install app dependencies if present
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --break-system-packages
          fi
          
          # Stop execution if tests fail to prevent pushing broken code
          pytest tests/ || exit 1

  # STAGE 4: Finalize the cycle by pushing the verified code
  deploy:
    name: Push Verified Changes
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download Final Code Artifact
        uses: actions/download-artifact@v4
        with:
          name: improved-code

      - name: Commit and Push to Main
        run: |
          git config --global user.name "AI-Agent-Bot"
          git config --global user.email "ai-bot@users.noreply.github.com"
          
          # Retrieve AI-generated commit message from Stage 1
          COMMIT_TEXT=$(cat .commit_msg)
          git add .
          git reset .commit_msg # Exclude the temporary message file from commit
          git commit -m "$COMMIT_TEXT [skip ci]"
          git push

  # STAGE 5: Resource Cleanup (Cost Control)
  cleanup:
    name: Infrastructure Cleanup
    needs: [provision, test, deploy]
    # Always delete the VPS even if tests or previous jobs fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Install Hetzner Cloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/

      - name: Destroy Ephemeral VPS
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          # Using the correct --selector flag for hcloud CLI
          SERVER_ID=$(hcloud server list --selector scope=ephemeral-test -o noheader -o "columns=id")
          if [ -n "$SERVER_ID" ]; then
            echo "Deleting server ID: $SERVER_ID"
            hcloud server delete $SERVER_ID
          else
            echo "No active ephemeral servers found."
          fi
